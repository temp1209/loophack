name: PII Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-no-pii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run PII check
        run: |
          chmod +x ./scripts/check-no-pii.sh
          ./scripts/check-no-pii.sh
